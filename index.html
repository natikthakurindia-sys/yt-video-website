<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Video Downloader</title>
<style>
  :root {
    --bg-0: #05080d;
    --card: rgba(15, 20, 27, 0.72);
    --card-border: #1d2733;
    --accent: #4fc3f7;
    --accent-2: #1565c0;
    --accent-3: #7c4dff;
    --text: #d8e0ea;
    --text-dim: #6b8299;
    --text-bright: #e3f2fd;
    --danger: #ff5252;
    --ok: #4caf50;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; background: var(--bg-0); color: var(--text);
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; overflow-x: hidden;
  }
  .aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .aurora::before {
    content: ''; position: absolute; inset: -50%;
    background:
      radial-gradient(circle at 20% 30%, rgba(21, 101, 192, 0.35), transparent 45%),
      radial-gradient(circle at 80% 25%, rgba(79, 195, 247, 0.25), transparent 50%),
      radial-gradient(circle at 50% 90%, rgba(124, 77, 255, 0.28), transparent 55%);
    animation: drift 22s ease-in-out infinite alternate; filter: blur(40px);
  }
  .aurora::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 0%, rgba(5,8,13,0.85) 100%);
  }
  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(-4%, 3%) scale(1.08); }
    100% { transform: translate(3%, -2%) scale(1.03); }
  }
  .grid-overlay {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background-image:
      linear-gradient(rgba(79,195,247,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79,195,247,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(circle at 50% 40%, black 20%, transparent 80%);
    -webkit-mask-image: radial-gradient(circle at 50% 40%, black 20%, transparent 80%);
  }
  .wrap { position: relative; z-index: 2; max-width: 1040px; margin: 0 auto; padding: 60px 24px 100px; }
  header { text-align: center; margin-bottom: 48px; animation: fadeDown 0.9s cubic-bezier(.2,.8,.2,1) both; }
  .brand { display: inline-flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .brand-mark {
    width: 42px; height: 42px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    display: grid; place-items: center;
    box-shadow: 0 0 24px rgba(79,195,247,0.45);
    animation: pulseGlow 3s ease-in-out infinite;
  }
  .brand-mark svg { width: 22px; height: 22px; fill: #fff; }
  @keyframes pulseGlow {
    0%,100% { box-shadow: 0 0 24px rgba(79,195,247,0.4); }
    50%     { box-shadow: 0 0 40px rgba(79,195,247,0.75); }
  }
  h1 { font-size: 22px; font-weight: 800; letter-spacing: 4px; color: var(--text-bright); }
  .tagline { color: var(--text-dim); font-size: 11px; letter-spacing: 5px; text-transform: uppercase; margin-top: 6px; }
  .search-shell { position: relative; margin-bottom: 40px; animation: fadeUp 0.9s .15s cubic-bezier(.2,.8,.2,1) both; }
  .search-bar {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--card-border); border-radius: 18px;
    padding: 8px 8px 8px 22px;
    transition: border-color 0.3s, box-shadow 0.3s, transform 0.3s;
  }
  .search-bar:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(79,195,247,0.12), 0 0 40px rgba(79,195,247,0.2);
    transform: translateY(-2px);
  }
  .search-bar svg { flex-shrink: 0; fill: var(--text-dim); transition: fill 0.3s; }
  .search-bar:focus-within svg { fill: var(--accent); }
  .search-bar input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); font-size: 15px; padding: 14px 0; font-family: inherit;
  }
  .search-bar input::placeholder { color: var(--text-dim); }
  .btn {
    position: relative; border: none; cursor: pointer;
    font-family: inherit; font-weight: 600; font-size: 14px; letter-spacing: 1px;
    padding: 14px 28px; border-radius: 12px; color: #fff;
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    overflow: hidden; transition: transform 0.2s, box-shadow 0.3s;
    box-shadow: 0 6px 20px rgba(21,101,192,0.35);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(79,195,247,0.5); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn::after {
    content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
    transition: left 0.6s;
  }
  .btn:hover::after { left: 100%; }
  .state { display: none; animation: fadeUp 0.6s cubic-bezier(.2,.8,.2,1) both; }
  .state.active { display: block; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-24px); } to { opacity: 1; transform: translateY(0); } }
  .loader { display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 80px 0; }
  .spinner {
    width: 56px; height: 56px; border-radius: 50%;
    border: 3px solid rgba(79,195,247,0.15); border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader p { color: var(--text-dim); font-size: 13px; letter-spacing: 3px; text-transform: uppercase; }
  .video-card {
    display: grid; grid-template-columns: 340px 1fr; gap: 26px;
    background: var(--card); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--card-border); border-radius: 20px;
    padding: 22px; margin-bottom: 26px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  @media (max-width: 760px) { .video-card { grid-template-columns: 1fr; } }
  .thumb-wrap { position: relative; border-radius: 14px; overflow: hidden; aspect-ratio: 16/9; background: #000; }
  .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.5s cubic-bezier(.2,.8,.2,1); }
  .video-card:hover .thumb-wrap img { transform: scale(1.05); }
  .duration-badge {
    position: absolute; bottom: 10px; right: 10px;
    background: rgba(0,0,0,0.85); color: #fff; font-size: 12px; font-weight: 600;
    padding: 4px 10px; border-radius: 6px; letter-spacing: 1px;
  }
  .meta { display: flex; flex-direction: column; justify-content: center; gap: 14px; }
  .meta h2 {
    font-size: 20px; font-weight: 700; color: var(--text-bright); line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .meta-row { display: flex; flex-wrap: wrap; gap: 20px; color: var(--text-dim); font-size: 13px; }
  .meta-row span { display: inline-flex; align-items: center; gap: 7px; }
  .meta-row svg { width: 15px; height: 15px; fill: var(--accent); }
  .section-title {
    font-size: 11px; letter-spacing: 4px; text-transform: uppercase;
    color: var(--text-dim); margin-bottom: 14px;
  }
  .format-tabs {
    display: inline-flex; gap: 6px;
    background: rgba(10,15,22,0.7); border: 1px solid var(--card-border);
    border-radius: 14px; padding: 6px; margin-bottom: 22px;
  }
  .tab {
    padding: 11px 28px; border-radius: 10px; border: none;
    background: transparent; color: var(--text-dim); font-family: inherit;
    font-weight: 600; font-size: 13px; letter-spacing: 2px; cursor: pointer;
    transition: all 0.35s cubic-bezier(.2,.8,.2,1);
  }
  .tab.active {
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    color: #fff; box-shadow: 0 6px 20px rgba(21,101,192,0.4);
  }
  .tab:not(.active):hover { color: var(--text); background: rgba(79,195,247,0.08); }
  .quality-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px; margin-bottom: 26px;
  }
  .quality-card {
    background: rgba(10,15,22,0.7); border: 1px solid var(--card-border);
    border-radius: 14px; padding: 16px 18px; cursor: pointer;
    transition: all 0.3s cubic-bezier(.2,.8,.2,1);
    position: relative; overflow: hidden;
  }
  .quality-card::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, transparent, rgba(79,195,247,0.08));
    opacity: 0; transition: opacity 0.3s;
  }
  .quality-card:hover {
    border-color: var(--accent); transform: translateY(-3px);
    box-shadow: 0 12px 30px rgba(79,195,247,0.2);
  }
  .quality-card:hover::before { opacity: 1; }
  .quality-card.selected {
    border-color: var(--accent); background: rgba(21,101,192,0.2);
    box-shadow: 0 0 0 3px rgba(79,195,247,0.15);
  }
  .quality-card .q-label { font-size: 17px; font-weight: 700; color: var(--text-bright); margin-bottom: 4px; }
  .quality-card .q-sub { font-size: 12px; color: var(--text-dim); }
  .quality-card .q-badge {
    position: absolute; top: 12px; right: 12px;
    font-size: 10px; letter-spacing: 1px; padding: 3px 8px; border-radius: 6px;
    background: rgba(79,195,247,0.15); color: var(--accent); font-weight: 600;
  }
  .action-row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  .btn-ghost {
    background: rgba(22,32,43,0.8); border: 1px solid var(--card-border);
    color: var(--text); box-shadow: none;
  }
  .btn-ghost:hover {
    background: rgba(29,42,56,0.9); border-color: var(--accent);
    box-shadow: 0 8px 24px rgba(79,195,247,0.2);
  }
  .progress-shell {
    background: var(--card); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--card-border); border-radius: 20px; padding: 28px; text-align: center;
  }
  .progress-bar { height: 8px; border-radius: 4px; background: rgba(79,195,247,0.1); overflow: hidden; margin: 20px 0 10px; }
  .progress-fill {
    height: 100%; width: 0%; border-radius: 4px;
    background: linear-gradient(90deg, var(--accent-2), var(--accent), var(--accent-3));
    background-size: 200% 100%; animation: shimmer 2s linear infinite;
    transition: width 0.4s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .progress-text { color: var(--text-dim); font-size: 13px; letter-spacing: 2px; }
  .toast {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(120px);
    background: rgba(15,20,27,0.95); backdrop-filter: blur(18px);
    border: 1px solid var(--card-border); border-radius: 14px;
    padding: 16px 26px; font-size: 14px; color: var(--text);
    box-shadow: 0 20px 50px rgba(0,0,0,0.6); z-index: 100;
    transition: transform 0.5s cubic-bezier(.2,.8,.2,1), opacity 0.5s;
    opacity: 0; max-width: 90vw;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .toast.err { border-color: var(--danger); }
  .toast.ok  { border-color: var(--ok); }
  footer { text-align: center; margin-top: 60px; color: var(--text-dim); font-size: 11px; letter-spacing: 3px; text-transform: uppercase; }
</style>
</head>
<body>

<div class="aurora"></div>
<div class="grid-overlay"></div>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
      <h1>YouTube Downloader</h1>
    </div>
    <div class="tagline">Paste · Download</div>
  </header>

  <div class="search-shell">
    <div class="search-bar">
      <svg width="20" height="20" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14"/></svg>
      <input type="text" id="urlInput" placeholder="YouTube video link yahan paste karo…" autocomplete="off">
      <button class="btn" id="fetchBtn">DOWNLOAD</button>
    </div>
  </div>

  <div class="state" id="stateLoading">
    <div class="loader">
      <div class="spinner"></div>
      <p>Fetching video info…</p>
    </div>
  </div>

  <div class="state" id="stateResult">
    <div class="video-card">
      <div class="thumb-wrap">
        <img id="thumbImg" src="" alt="">
        <div class="duration-badge" id="durationBadge">--:--</div>
      </div>
      <div class="meta">
        <h2 id="videoTitle">—</h2>
        <div class="meta-row">
          <span>
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2m0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3m0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08s5.97 1.09 6 3.08c-1.29 1.94-3.5 3.22-6 3.22"/></svg>
            <span id="channelName">—</span>
          </span>
          <span>
            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5M12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5m0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3"/></svg>
            <span id="viewCount">—</span>
          </span>
        </div>
      </div>
    </div>

    <div class="section-title">Choose format</div>
    <div class="format-tabs" id="formatTabs">
      <button class="tab active" data-fmt="mp4">MP4 · VIDEO</button>
      <button class="tab" data-fmt="mp3">MP3 · AUDIO</button>
    </div>

    <div class="quality-grid" id="qualityGrid"></div>

    <div class="action-row">
      <button class="btn" id="downloadBtn" disabled>DOWNLOAD</button>
      <button class="btn btn-ghost" id="resetBtn">RESET</button>
    </div>
  </div>

  <div class="state" id="stateDownload">
    <div class="progress-shell">
      <div class="section-title">Downloading</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText">0%</div>
    </div>
  </div>

  <footer>YouTube Video Downloader</footer>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '';

const state = { video: null, format: 'mp4', quality: null, url: '', jobId: null };
const $ = (id) => document.getElementById(id);
const els = {
  urlInput: $('urlInput'), fetchBtn: $('fetchBtn'),
  stateLoading: $('stateLoading'), stateResult: $('stateResult'), stateDownload: $('stateDownload'),
  thumbImg: $('thumbImg'), durationBadge: $('durationBadge'),
  videoTitle: $('videoTitle'), channelName: $('channelName'), viewCount: $('viewCount'),
  formatTabs: $('formatTabs'), qualityGrid: $('qualityGrid'),
  downloadBtn: $('downloadBtn'), resetBtn: $('resetBtn'),
  progressFill: $('progressFill'), progressText: $('progressText'),
  toast: $('toast'),
};

function showState(name) {
  ['stateLoading','stateResult','stateDownload'].forEach(s => {
    els[s].classList.toggle('active', s === name);
  });
}
function toast(msg, kind = '') {
  els.toast.textContent = msg;
  els.toast.className = 'toast show ' + kind;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { els.toast.className = 'toast'; }, 3400);
}
function fmtViews(n) {
  if (!n && n !== 0) return '—';
  if (n >= 1e9) return (n/1e9).toFixed(1) + 'B views';
  if (n >= 1e6) return (n/1e6).toFixed(1) + 'M views';
  if (n >= 1e3) return (n/1e3).toFixed(1) + 'K views';
  return n + ' views';
}
function fmtDuration(sec) {
  if (!sec && sec !== 0) return '--:--';
  sec = Math.floor(sec);
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  const pad = (x) => String(x).padStart(2, '0');
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}

function renderQualities() {
  if (!state.video || !state.video.qualities) return;
  const list = state.video.qualities[state.format] || [];
  els.qualityGrid.innerHTML = '';
  state.quality = null;
  els.downloadBtn.disabled = true;

  if (list.length === 0) {
    els.qualityGrid.innerHTML = '<div style="color:#6b8299;padding:16px">Is video ke liye koi quality available nahi</div>';
    return;
  }

  list.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'quality-card';
    card.dataset.id = q.id;
    card.style.animation = `fadeUp 0.5s ${i * 0.05}s cubic-bezier(.2,.8,.2,1) both`;
    card.innerHTML = `
      ${q.badge ? `<div class="q-badge">${q.badge}</div>` : ''}
      <div class="q-label">${q.label}</div>
      <div class="q-sub">${q.sub || ''}</div>
    `;
    card.addEventListener('click', () => {
      document.querySelectorAll('.quality-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      state.quality = q.id;
      els.downloadBtn.disabled = false;
    });
    els.qualityGrid.appendChild(card);
  });
}

async function handleFetch() {
  const raw = els.urlInput.value.trim();
  if (!raw) { toast('Pehle YouTube link daalo', 'err'); return; }
  state.url = raw;

  showState('stateLoading');
  try {
    const res = await fetch(`${API}/api/info?url=${encodeURIComponent(raw)}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Fetch failed');
    if (!data.qualities || (!data.qualities.mp4?.length && !data.qualities.mp3?.length)) {
      throw new Error('Is video ke liye koi downloadable format nahi mila');
    }
    state.video = data;

    els.thumbImg.src = data.thumbnail;
    els.videoTitle.textContent = data.title || '—';
    els.channelName.textContent = data.channel || '—';
    els.viewCount.textContent = fmtViews(data.views);
    els.durationBadge.textContent = fmtDuration(data.duration);

    state.format = 'mp4';
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.fmt === 'mp4'));
    renderQualities();

    showState('stateResult');
    toast('Video mil gaya — format choose karo', 'ok');
  } catch (err) {
    console.error(err);
    showState('');
    toast('Fetch fail: ' + (err.message || 'unknown'), 'err');
  }
}

// POST /api/download -> job_id -> poll -> /api/file trigger
async function handleDownload() {
  if (!state.quality) { toast('Pehle quality choose karo', 'err'); return; }
  showState('stateDownload');
  els.progressFill.style.width = '0%';
  els.progressText.textContent = '0%';

  try {
    const res = await fetch(`${API}/api/download`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: state.url, format: state.format, quality: state.quality }),
    });

    // Guard: agar non-JSON aaya to clear error
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); }
    catch { throw new Error('Server error: ' + text.slice(0, 120)); }

    if (!res.ok) throw new Error(data.error || 'Download start failed');
    state.jobId = data.job_id;
    pollProgress();
  } catch (err) {
    console.error(err);
    toast('Download fail: ' + (err.message || 'unknown'), 'err');
    showState('stateResult');
  }
}

function pollProgress() {
  const tick = async () => {
    try {
      const res = await fetch(`${API}/api/progress/${state.jobId}`);
      const job = await res.json();
      if (!res.ok) throw new Error(job.error || 'Progress error');

      const pct = job.progress || 0;
      els.progressFill.style.width = pct + '%';
      els.progressText.textContent = pct + '%';

      if (job.status === 'done') {
        toast('Download complete — file save ho rahi hai', 'ok');
        // Hidden anchor click — browser native download trigger, no redirect
        const a = document.createElement('a');
        a.href = `${API}/api/file/${state.jobId}`;
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => showState('stateResult'), 1500);
        return;
      }
      if (job.status === 'error') {
        toast('Download error: ' + (job.error || 'unknown'), 'err');
        showState('stateResult');
        return;
      }
      setTimeout(tick, 700);
    } catch (err) {
      toast('Progress check fail: ' + err.message, 'err');
      showState('stateResult');
    }
  };
  tick();
}

els.fetchBtn.addEventListener('click', handleFetch);
els.urlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleFetch(); });

els.formatTabs.addEventListener('click', (e) => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  state.format = tab.dataset.fmt;
  renderQualities();
});

els.downloadBtn.addEventListener('click', handleDownload);
els.resetBtn.addEventListener('click', () => {
  els.urlInput.value = '';
  state.video = null; state.quality = null; state.jobId = null; state.url = '';
  showState('');
});

window.addEventListener('load', () => els.urlInput.focus());
</script>
</body>
</html>
